[project]
name = "p2p-tg-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn>=0.38.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.12",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
]
[tool.ruff]

line-length = 120

[tool.ruff.lint]

select = ["E", "F", "I", "N", "UP"]

